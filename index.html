<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #111827;
      color: #f9fafb;
      text-align: center;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.5s ease;
    }

    /* Sunset & Temporal Return Sky Layers */
    .sky-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 0;
    }

    .sky-sunset {
      background: radial-gradient(circle at 50% 85%, #f97316 0%, #b91c1c 35%, #4c1d95 75%, #0f172a 100%);
    }

    .sky-return {
      background: radial-gradient(circle at 50% 25%, #38bdf8 0%, #2563eb 45%, #0f172a 90%);
    }

    /* Subtle CRT scanline overlay during overflow */
    body.system-crashed::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 10;
    }

    .card { 
      padding: 2rem; 
      max-width: 620px; 
      position: relative;
      z-index: 2;
      border-radius: 12px;
      background: rgba(17, 24, 39, 0.86);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: box-shadow 0.3s, border 0.3s, background 0.3s;
    }

    .card.crashed-card {
      border: 1px solid rgba(239, 68, 68, 0.6);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.25);
      background: rgba(17, 24, 39, 0.94);
    }

    .counter { font-size: 1.5rem; font-weight: 700; margin: 0.5rem 0; font-variant-numeric: tabular-nums; }
    .sub { color: #9ca3af; font-size: 0.95rem; }
    .elapsed { color: #38bdf8; font-family: monospace; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
    .overflowed { color: #ef4444 !important; }
    .warping-sunset { color: #fb923c !important; }
    .warping-return { color: #38bdf8 !important; }
    
    /* 32-Bit Binary Register Display */
    .binary-box {
      font-family: monospace;
      font-size: 0.85rem;
      background: #090d16;
      padding: 0.65rem;
      border-radius: 6px;
      margin: 0.75rem auto;
      border: 1px solid #1e293b;
      letter-spacing: 1px;
      word-break: break-all;
    }
    .sign-bit {
      color: #10b981;
      font-weight: 800;
      padding: 1px 4px;
      background: rgba(16, 185, 129, 0.15);
      border-radius: 3px;
    }
    .sign-bit.flipped {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.25);
    }

    /* Run Progress Bar */
    .sim-progress-wrap {
      display: none;
      margin: 1rem auto 0;
      max-width: 440px;
      text-align: left;
    }
    .sim-progress-meta {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 0.8rem;
      color: #fb923c;
      margin-bottom: 0.35rem;
    }
    .sim-progress-track {
      width: 100%;
      height: 8px;
      background: #1f2937;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #374151;
    }
    .sim-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #f97316, #ef4444);
      transition: width 0.05s linear;
    }

    /* Simulation Controls & Readout */
    .controls {
      margin: 1.25rem 0;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

      background: #2563eb;
